[project]
name = "churngaurd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "feast>=0.65.0",
    "groq>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow==2.19.0",
    "pandas==2.2.3",
    "protobuf>=4.21,<5.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "setuptools>=84.0.0",
    "shap>=0.52.0",
    "xgboost>=3.4.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]
